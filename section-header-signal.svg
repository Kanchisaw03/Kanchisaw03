<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%">
  <defs>
    <linearGradient id="sigGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#B8D4FF"/>
      <stop offset="50%" style="stop-color:#FFB8D4"/>
      <stop offset="100%" style="stop-color:#E6B8FF"/>
    </linearGradient>
    <filter id="sigGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <line x1="50" y1="50" x2="180" y2="50" stroke="url(#sigGrad)" stroke-width="3" opacity="0.7">
    <animate attributeName="x2" values="130;180;130" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="620" y1="50" x2="750" y2="50" stroke="url(#sigGrad)" stroke-width="3" opacity="0.7">
    <animate attributeName="x1" values="670;620;670" dur="3s" repeatCount="indefinite"/>
  </line>
  
  <!-- Signal Icon -->
  <g transform="translate(200, 50)">
    <circle r="6" fill="#B8D4FF">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="10" fill="none" stroke="#B8D4FF" stroke-width="2" opacity="0">
      <animate attributeName="r" values="6;20" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle r="10" fill="none" stroke="#B8D4FF" stroke-width="2" opacity="0">
      <animate attributeName="r" values="6;20" dur="2s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.9;0" dur="2s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
  
  <circle cx="600" cy="50" r="6" fill="#E6B8FF" opacity="0.9">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <text x="400" y="60" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="32" fill="url(#sigGrad)" filter="url(#sigGlow)" letter-spacing="6">
    CONNECT WITH ME
  </text>
</svg>
