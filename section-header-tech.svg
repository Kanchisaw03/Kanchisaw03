<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6B8FF"/>
      <stop offset="50%" style="stop-color:#FFB8D4"/>
      <stop offset="100%" style="stop-color:#B8D4FF"/>
    </linearGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <line x1="50" y1="50" x2="200" y2="50" stroke="url(#headerGrad)" stroke-width="3" opacity="0.7">
    <animate attributeName="x2" values="150;200;150" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="600" y1="50" x2="750" y2="50" stroke="url(#headerGrad)" stroke-width="3" opacity="0.7">
    <animate attributeName="x1" values="650;600;650" dur="3s" repeatCount="indefinite"/>
  </line>
  
  <circle cx="220" cy="50" r="6" fill="#E6B8FF" opacity="0.9">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="580" cy="50" r="6" fill="#B8D4FF" opacity="0.9">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  
  <text x="400" y="60" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="32" fill="url(#headerGrad)" filter="url(#hGlow)" letter-spacing="6">
    LANGUAGES &amp; TOOLS
  </text>
</svg>
