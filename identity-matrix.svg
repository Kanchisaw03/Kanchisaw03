<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%">
  <defs>
    <linearGradient id="idGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6B8FF"/>
      <stop offset="50%" style="stop-color:#FFB8D4"/>
      <stop offset="100%" style="stop-color:#B8D4FF"/>
    </linearGradient>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="textClip1">
      <rect x="0" y="0" width="0" height="100">
        <animate attributeName="width" values="0;800" dur="3s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="textClip2">
      <rect x="0" y="80" width="0" height="80">
        <animate attributeName="width" values="0;0;800" dur="5s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="textClip3">
      <rect x="0" y="140" width="0" height="80">
        <animate attributeName="width" values="0;0;0;800" dur="6.5s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>
  
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <!-- Background Glow -->
  <ellipse cx="400" cy="110" rx="350" ry="90" fill="#E6B8FF" opacity="0.05">
    <animate attributeName="opacity" values="0.03;0.08;0.03" dur="6s" repeatCount="indefinite"/>
  </ellipse>
  
  <!-- Terminal Indicator -->
  <text x="40" y="65" font-family="'Courier New', monospace" font-size="36" fill="#4a4a6a" opacity="0.7">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    &gt;_
  </text>
  
  <!-- Main Text Line 1 -->
  <g clip-path="url(#textClip1)">
    <text x="110" y="70" font-family="'Segoe UI', Arial, sans-serif" font-size="30" fill="url(#idGrad)" filter="url(#textGlow)">
      Building the decentralized future with code
    </text>
  </g>
  
  <!-- Main Text Line 2 -->
  <g clip-path="url(#textClip2)">
    <text x="110" y="125" font-family="'Segoe UI', Arial, sans-serif" font-size="22" fill="#B8D4FF" opacity="0.9">
      💬 Ask me about: MERN Stack · Python · Vue.js
    </text>
  </g>
  
  <!-- Main Text Line 3 -->
  <g clip-path="url(#textClip3)">
    <text x="110" y="175" font-family="'Segoe UI', Arial, sans-serif" font-size="20" fill="#FFB8D4" opacity="0.85">
      ⚡ Rust · System Compilers · Operating Systems
    </text>
  </g>
  
  <!-- Blinking Cursor -->
  <rect x="110" y="40" width="18" height="40" fill="#FFB8D4">
    <animate attributeName="x" values="110;650;650" dur="3s" fill="freeze"/>
    <animate attributeName="opacity" values="1;1;0;0;1;1;0;0" dur="1s" repeatCount="indefinite" begin="3s"/>
  </rect>
  
  <!-- Side Accent -->
  <line x1="760" y1="30" x2="760" y2="190" stroke="#2d1f3d" stroke-width="3" opacity="0.6"/>
  <line x1="760" y1="30" x2="760" y2="30" stroke="url(#idGrad)" stroke-width="3">
    <animate attributeName="y2" values="30;190" dur="1.5s" begin="5s" fill="freeze"/>
  </line>
</svg>
