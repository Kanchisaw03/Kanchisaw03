<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="100%">
  <defs>
    <linearGradient id="sysGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6B8FF;stop-opacity:0.4"/>
      <stop offset="50%" style="stop-color:#FFB8D4;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#B8D4FF;stop-opacity:0.4"/>
    </linearGradient>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6B8FF"/>
      <stop offset="100%" style="stop-color:#c49ee0"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB8D4"/>
      <stop offset="100%" style="stop-color:#e0a0b8"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8D4FF"/>
      <stop offset="100%" style="stop-color:#9cb8e0"/>
    </linearGradient>
    <linearGradient id="nodeGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B8FFD4"/>
      <stop offset="100%" style="stop-color:#98d4b8"/>
    </linearGradient>
    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main Container -->
  <rect x="3" y="3" width="794" height="544" rx="16" fill="url(#sysGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  
  <!-- Header Bar -->
  <rect x="20" y="20" width="760" height="55" rx="10" fill="#1a1a2e" opacity="0.9"/>
  <circle cx="50" cy="47" r="8" fill="#ff6b6b" opacity="0.9"/>
  <circle cx="80" cy="47" r="8" fill="#ffd93d" opacity="0.9"/>
  <circle cx="110" cy="47" r="8" fill="#6bcb77" opacity="0.9"/>
  <text x="400" y="55" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" fill="#E6B8FF" letter-spacing="4">
    DEVELOPER_PROFILE.sys
  </text>
  
  <!-- Status -->
  <circle cx="740" cy="47" r="8" fill="#6bcb77">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="720" y="52" text-anchor="end" font-family="'Courier New', monospace" font-size="14" fill="#6bcb77">ACTIVE</text>
  
  <!-- Core Module - Center -->
  <g transform="translate(400, 295)">
    <!-- Outer Ring -->
    <circle r="80" fill="none" stroke="url(#nodeGrad1)" stroke-width="3" opacity="0.4">
      <animate attributeName="r" values="80;90;80" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <!-- Inner Ring -->
    <circle r="60" fill="none" stroke="url(#nodeGrad2)" stroke-width="2" stroke-dasharray="8,8">
      <animateTransform attributeName="transform" type="rotate" values="0;360" dur="20s" repeatCount="indefinite"/>
    </circle>
    <!-- Core -->
    <circle r="45" fill="#1a1a2e" stroke="url(#nodeGrad1)" stroke-width="3"/>
    <text y="-5" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#E6B8FF" font-weight="bold">KANCHI</text>
    <text y="15" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#E6B8FF" font-weight="bold">SAW</text>
    
    <!-- Pulse -->
    <circle r="45" fill="none" stroke="#E6B8FF" stroke-width="2" opacity="0">
      <animate attributeName="r" values="45;100" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Module 1: MERN Stack -->
  <g transform="translate(140, 180)">
    <rect x="-100" y="-45" width="200" height="90" rx="12" fill="#1a1a2e" stroke="url(#nodeGrad1)" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text y="-10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#E6B8FF" font-weight="600">MERN STACK</text>
    <text y="15" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#6e7681">Full-Stack Development</text>
    <text y="38" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#6bcb77">● ACTIVE</text>
    <line x1="100" y1="0" x2="220" y2="80" stroke="#E6B8FF" stroke-width="2" opacity="0.3" stroke-dasharray="6,6">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Module 2: Web3 & Blockchain -->
  <g transform="translate(140, 410)">
    <rect x="-100" y="-45" width="200" height="90" rx="12" fill="#1a1a2e" stroke="url(#nodeGrad4)" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </rect>
    <text y="-10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#B8FFD4" font-weight="600">WEB3 &amp; SOLANA</text>
    <text y="15" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#6e7681">Blockchain Development</text>
    <text y="38" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#ffd93d">● LEARNING</text>
    <line x1="100" y1="0" x2="220" y2="-80" stroke="#B8FFD4" stroke-width="2" opacity="0.3" stroke-dasharray="6,6">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Module 3: Python & Vue -->
  <g transform="translate(660, 180)">
    <rect x="-100" y="-45" width="200" height="90" rx="12" fill="#1a1a2e" stroke="url(#nodeGrad3)" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3.2s" repeatCount="indefinite" begin="1s"/>
    </rect>
    <text y="-10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#B8D4FF" font-weight="600">PYTHON &amp; VUE</text>
    <text y="15" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#6e7681">Backend &amp; Frontend</text>
    <text y="38" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#6bcb77">● ACTIVE</text>
    <line x1="-100" y1="0" x2="-220" y2="80" stroke="#B8D4FF" stroke-width="2" opacity="0.3" stroke-dasharray="6,6">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.8s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Module 4: Systems Programming -->
  <g transform="translate(660, 410)">
    <rect x="-100" y="-45" width="200" height="90" rx="12" fill="#1a1a2e" stroke="url(#nodeGrad2)" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.8s" repeatCount="indefinite" begin="1.5s"/>
    </rect>
    <text y="-10" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#FFB8D4" font-weight="600">RUST &amp; SYSTEMS</text>
    <text y="15" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#6e7681">Compilers &amp; OS Dev</text>
    <text y="38" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#6bcb77">● ACTIVE</text>
    <line x1="-100" y1="0" x2="-220" y2="-80" stroke="#FFB8D4" stroke-width="2" opacity="0.3" stroke-dasharray="6,6">
      <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3.3s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Data Flow Particles -->
  <circle r="5" fill="#E6B8FF" opacity="0.9">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 140,180 Q 270,230 360,295"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="5" fill="#B8FFD4" opacity="0.9">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M 140,410 Q 270,360 360,295" begin="1s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <circle r="5" fill="#B8D4FF" opacity="0.9">
    <animateMotion dur="4s" repeatCount="indefinite" path="M 660,180 Q 530,230 440,295" begin="0.5s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle r="5" fill="#FFB8D4" opacity="0.9">
    <animateMotion dur="4.5s" repeatCount="indefinite" path="M 660,410 Q 530,360 440,295" begin="1.5s"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="4.5s" repeatCount="indefinite" begin="1.5s"/>
  </circle>
  
  <!-- Footer Stats -->
  <g transform="translate(0, 510)">
    <line x1="20" y1="0" x2="780" y2="0" stroke="#2d1f3d" stroke-width="2"/>
    <text x="130" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#6e7681">📍 INDIA</text>
    <text x="330" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#6e7681">MODULES: 4</text>
    <text x="530" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#6e7681">STATUS: BUILDING</text>
    <text x="700" y="28" text-anchor="middle" font-family="'Courier New', monospace" font-size="14" fill="#6bcb77">🟢 ONLINE</text>
  </g>
</svg>
