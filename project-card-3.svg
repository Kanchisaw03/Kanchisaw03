<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%">
  <defs>
    <linearGradient id="pc3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="pc3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB8D4"/>
      <stop offset="100%" style="stop-color:#e0a0b8"/>
    </linearGradient>
    <filter id="pc3Glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#pc3Bg)"/>
  
  <!-- Card -->
  <rect x="30" y="20" width="740" height="280" rx="16" fill="#1a1a2e" stroke="url(#pc3Grad)" stroke-width="2" filter="url(#pc3Glow)">
    <animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="5s" repeatCount="indefinite" begin="1s"/>
  </rect>
  
  <!-- Status -->
  <circle cx="730" cy="55" r="10" fill="#6bcb77">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="1s"/>
  </circle>
  <text x="705" y="59" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#6bcb77">ACTIVE</text>
  
  <!-- Icon -->
  <g transform="translate(70, 70)">
    <rect x="-30" y="-30" width="60" height="60" rx="12" fill="#3d1f2d"/>
    <text y="8" text-anchor="middle" font-size="28">⚙️</text>
  </g>
  
  <!-- Title -->
  <text x="130" y="55" font-family="'Segoe UI', sans-serif" font-size="28" fill="#FFB8D4" font-weight="700">Systems Programming</text>
  <text x="130" y="85" font-family="'Segoe UI', sans-serif" font-size="18" fill="#6e7681">Low-level development &amp; compilers</text>
  
  <!-- Description -->
  <text x="50" y="140" font-family="'Segoe UI', sans-serif" font-size="18" fill="#c9d1d9">Working on Rust-based system compilers, operating system</text>
  <text x="50" y="170" font-family="'Segoe UI', sans-serif" font-size="18" fill="#c9d1d9">components, and low-level performance-critical software.</text>
  
  <!-- Tech Tags -->
  <g transform="translate(50, 205)">
    <rect width="70" height="36" rx="8" fill="#3d1f2d" stroke="#FFB8D4" stroke-width="1"/>
    <text x="35" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#FFB8D4">Rust</text>
    
    <rect x="85" width="50" height="36" rx="8" fill="#3d1f2d" stroke="#FFB8D4" stroke-width="1"/>
    <text x="110" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#FFB8D4">C</text>
    
    <rect x="150" width="60" height="36" rx="8" fill="#3d1f2d" stroke="#FFB8D4" stroke-width="1"/>
    <text x="180" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#FFB8D4">C++</text>
    
    <rect x="225" width="100" height="36" rx="8" fill="#3d1f2d" stroke="#FFB8D4" stroke-width="1"/>
    <text x="275" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#FFB8D4">Compilers</text>
    
    <rect x="340" width="60" height="36" rx="8" fill="#3d1f2d" stroke="#FFB8D4" stroke-width="1"/>
    <text x="370" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#FFB8D4">OS</text>
  </g>
  
  <!-- Metrics -->
  <g transform="translate(50, 265)">
    <text font-family="'Courier New', monospace" font-size="16" fill="#6e7681">
      <tspan>⚡ Focus:</tspan>
      <tspan dx="20" fill="#FFB8D4">System Compilers • Operating Systems • Performance</tspan>
    </text>
  </g>
</svg>
