<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="100%">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6B8FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#FFB8D4;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#B8D4FF;stop-opacity:0"/>
    </linearGradient>
    <filter id="divGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <!-- Main Line -->
  <line x1="50" y1="40" x2="750" y2="40" stroke="url(#divGrad)" stroke-width="2">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </line>
  
  <!-- Constellation Nodes -->
  <g filter="url(#divGlow)">
    <circle cx="200" cy="40" r="6" fill="#E6B8FF">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="6;8;6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="320" cy="32" r="4" fill="#FFB8D4">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <circle cx="400" cy="40" r="8" fill="#ffffff">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="8;10;8" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="48" r="4" fill="#FFB8D4">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="600" cy="40" r="6" fill="#B8D4FF">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="r" values="6;8;6" dur="3s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
  </g>
  
  <!-- Connecting Lines -->
  <g stroke="#E6B8FF" stroke-width="1.5" opacity="0.4">
    <line x1="200" y1="40" x2="320" y2="32">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="320" y1="32" x2="400" y2="40">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite" begin="0.5s"/>
    </line>
    <line x1="400" y1="40" x2="480" y2="48">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite" begin="1s"/>
    </line>
    <line x1="480" y1="48" x2="600" y2="40">
      <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4s" repeatCount="indefinite" begin="1.5s"/>
    </line>
  </g>
</svg>
