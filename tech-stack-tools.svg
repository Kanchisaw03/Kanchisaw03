<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%">
  <defs>
    <linearGradient id="tlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="tlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB8D4"/>
      <stop offset="100%" style="stop-color:#e0a0b8"/>
    </linearGradient>
    <filter id="tlGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#tlBg)"/>
  
  <!-- Header -->
  <rect x="20" y="15" width="260" height="40" rx="8" fill="#1a1a2e" stroke="url(#tlGrad)" stroke-width="2"/>
  <text x="150" y="42" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#FFB8D4" font-weight="600">☆ AI/ML &amp; DESIGN</text>
  
  <!-- Connecting Line -->
  <line x1="280" y1="35" x2="320" y2="100" stroke="#FFB8D4" stroke-width="2" opacity="0.3"/>
  
  <!-- Tech Nodes -->
  <g transform="translate(80, 130)" filter="url(#tlGlow)">
    <circle r="35" fill="#1a1a2e" stroke="#FFB8D4" stroke-width="3">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text y="6" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#FFB8D4" font-weight="bold">PyTorch</text>
  </g>
  
  <g transform="translate(175, 130)" filter="url(#tlGlow)">
    <circle r="35" fill="#1a1a2e" stroke="#FFB8D4" stroke-width="3">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <text y="6" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#FFB8D4" font-weight="bold">TensorFlow</text>
  </g>
  
  <g transform="translate(270, 130)" filter="url(#tlGlow)">
    <circle r="35" fill="#1a1a2e" stroke="#FFB8D4" stroke-width="3">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <text y="6" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#FFB8D4" font-weight="bold">Pandas</text>
  </g>
  
  <g transform="translate(365, 130)" filter="url(#tlGlow)">
    <circle r="35" fill="#1a1a2e" stroke="#E6B8FF" stroke-width="3">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3.8s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
    <text y="6" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#E6B8FF" font-weight="bold">Figma</text>
  </g>
  
  <g transform="translate(460, 130)" filter="url(#tlGlow)">
    <circle r="35" fill="#1a1a2e" stroke="#E6B8FF" stroke-width="3">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3.2s" repeatCount="indefinite" begin="0.8s"/>
    </circle>
    <text y="6" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E6B8FF" font-weight="bold">Photoshop</text>
  </g>
  
  <g transform="translate(555, 130)" filter="url(#tlGlow)">
    <circle r="35" fill="#1a1a2e" stroke="#E6B8FF" stroke-width="3">
      <animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="4.2s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <text y="6" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E6B8FF">Illustrator</text>
  </g>
  
  <g transform="translate(650, 130)" filter="url(#tlGlow)">
    <circle r="35" fill="#1a1a2e" stroke="#E6B8FF" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="3.6s" repeatCount="indefinite" begin="1.2s"/>
    </circle>
    <text y="6" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" fill="#E6B8FF">Blender</text>
  </g>
  
  <g transform="translate(740, 130)" filter="url(#tlGlow)">
    <circle r="32" fill="#1a1a2e" stroke="#E6B8FF" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="3.4s" repeatCount="indefinite" begin="0.6s"/>
    </circle>
    <text y="6" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#E6B8FF">XD</text>
  </g>
  
  <!-- Connection Lines -->
  <g stroke="#FFB8D4" stroke-width="1.5" opacity="0.25">
    <line x1="115" y1="130" x2="140" y2="130"/>
    <line x1="210" y1="130" x2="235" y2="130"/>
    <line x1="305" y1="130" x2="330" y2="130"/>
  </g>
  <g stroke="#E6B8FF" stroke-width="1.5" opacity="0.25">
    <line x1="400" y1="130" x2="425" y2="130"/>
    <line x1="495" y1="130" x2="520" y2="130"/>
    <line x1="590" y1="130" x2="615" y2="130"/>
    <line x1="685" y1="130" x2="708" y2="130"/>
  </g>
</svg>
