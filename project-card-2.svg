<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%">
  <defs>
    <linearGradient id="pc2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d1a"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="pc2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E6B8FF"/>
      <stop offset="100%" style="stop-color:#c49ee0"/>
    </linearGradient>
    <filter id="pc2Glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#pc2Bg)"/>
  
  <!-- Card -->
  <rect x="30" y="20" width="740" height="280" rx="16" fill="#1a1a2e" stroke="url(#pc2Grad)" stroke-width="2" filter="url(#pc2Glow)">
    <animate attributeName="stroke-opacity" values="0.5;0.9;0.5" dur="4.5s" repeatCount="indefinite" begin="0.5s"/>
  </rect>
  
  <!-- Status -->
  <circle cx="730" cy="55" r="10" fill="#6bcb77">
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <text x="705" y="59" text-anchor="end" font-family="'Courier New', monospace" font-size="12" fill="#6bcb77">ACTIVE</text>
  
  <!-- Icon -->
  <g transform="translate(70, 70)">
    <rect x="-30" y="-30" width="60" height="60" rx="12" fill="#2d1f3d"/>
    <text y="8" text-anchor="middle" font-size="28">⚡</text>
  </g>
  
  <!-- Title -->
  <text x="130" y="55" font-family="'Segoe UI', sans-serif" font-size="28" fill="#E6B8FF" font-weight="700">Full-Stack MERN Apps</text>
  <text x="130" y="85" font-family="'Segoe UI', sans-serif" font-size="18" fill="#6e7681">Modern web application development</text>
  
  <!-- Description -->
  <text x="50" y="140" font-family="'Segoe UI', sans-serif" font-size="18" fill="#c9d1d9">Building scalable full-stack applications using MongoDB,</text>
  <text x="50" y="170" font-family="'Segoe UI', sans-serif" font-size="18" fill="#c9d1d9">Express, React, Node.js with modern best practices.</text>
  
  <!-- Tech Tags -->
  <g transform="translate(50, 205)">
    <rect width="100" height="36" rx="8" fill="#2d1f3d" stroke="#E6B8FF" stroke-width="1"/>
    <text x="50" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#E6B8FF">MongoDB</text>
    
    <rect x="115" width="90" height="36" rx="8" fill="#2d1f3d" stroke="#E6B8FF" stroke-width="1"/>
    <text x="160" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#E6B8FF">Express</text>
    
    <rect x="220" width="80" height="36" rx="8" fill="#2d1f3d" stroke="#E6B8FF" stroke-width="1"/>
    <text x="260" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#E6B8FF">React</text>
    
    <rect x="315" width="90" height="36" rx="8" fill="#2d1f3d" stroke="#E6B8FF" stroke-width="1"/>
    <text x="360" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#E6B8FF">Node.js</text>
    
    <rect x="420" width="80" height="36" rx="8" fill="#2d1f3d" stroke="#E6B8FF" stroke-width="1"/>
    <text x="460" y="24" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#E6B8FF">Vue.js</text>
  </g>
  
  <!-- Metrics -->
  <g transform="translate(50, 265)">
    <text font-family="'Courier New', monospace" font-size="16" fill="#6e7681">
      <tspan>💬 Ask me about:</tspan>
      <tspan dx="20" fill="#E6B8FF">MERN Stack • Python • Vue.js</tspan>
    </text>
  </g>
</svg>
