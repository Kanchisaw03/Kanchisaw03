<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" width="100%">
  <defs>
    <filter id="contactGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="contactLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6B8FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#FFB8D4;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#B8D4FF;stop-opacity:0"/>
    </linearGradient>
  </defs>
  
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <!-- Connecting Line -->
  <line x1="150" y1="80" x2="650" y2="80" stroke="url(#contactLine)" stroke-width="2">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite"/>
  </line>
  
  <!-- Node 1: LinkedIn -->
  <g transform="translate(200, 80)" filter="url(#contactGlow)">
    <circle r="40" fill="#1a1a2e" stroke="#E6B8FF" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text y="8" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" fill="#E6B8FF" font-weight="bold">in</text>
    <text y="85" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#6e7681">LinkedIn</text>
    
    <!-- Pulse -->
    <circle r="40" fill="none" stroke="#E6B8FF" stroke-width="2" opacity="0">
      <animate attributeName="r" values="40;60" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Node 2: Email -->
  <g transform="translate(400, 80)" filter="url(#contactGlow)">
    <circle r="45" fill="#1a1a2e" stroke="#FFB8D4" stroke-width="3">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
    <text y="8" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="24" fill="#FFB8D4" font-weight="bold">@</text>
    <text y="95" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#6e7681">Email</text>
    
    <circle r="45" fill="none" stroke="#FFB8D4" stroke-width="2" opacity="0">
      <animate attributeName="r" values="45;70" dur="3s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
  
  <!-- Node 3: GitHub -->
  <g transform="translate(600, 80)" filter="url(#contactGlow)">
    <circle r="40" fill="#1a1a2e" stroke="#B8D4FF" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="3.2s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <text y="10" text-anchor="middle" font-size="28">🐙</text>
    <text y="85" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" fill="#6e7681">GitHub</text>
    
    <circle r="40" fill="none" stroke="#B8D4FF" stroke-width="2" opacity="0">
      <animate attributeName="r" values="40;60" dur="3s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0.7;0" dur="3s" repeatCount="indefinite" begin="2s"/>
    </circle>
  </g>
  
  <!-- Traveling Signal -->
  <circle r="5" fill="#FFB8D4" opacity="0.9">
    <animate attributeName="cx" values="200;600" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;80" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
