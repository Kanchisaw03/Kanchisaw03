<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%">
  <defs>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#E6B8FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#FFB8D4;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#B8D4FF;stop-opacity:0"/>
    </linearGradient>
    <filter id="footGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="#0d1117"/>
  
  <!-- Top Line -->
  <line x1="100" y1="25" x2="700" y2="25" stroke="url(#footGrad)" stroke-width="2">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="4s" repeatCount="indefinite"/>
  </line>
  
  <!-- Signature Text -->
  <text x="400" y="70" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#6e7681" letter-spacing="3">
    CRAFTED WITH PASSION
  </text>
  
  <text x="400" y="95" text-anchor="middle" font-family="'Courier New', monospace" font-size="16" fill="#4a4a6a" letter-spacing="2">
    📫 siddheesaw@gmail.com
  </text>
  
  <!-- Signature Diamond -->
  <g transform="translate(400, 125)" filter="url(#footGlow)">
    <polygon points="0,-12 12,0 0,12 -12,0" fill="none" stroke="#FFB8D4" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <circle r="4" fill="#FFB8D4">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Side Accents -->
  <circle cx="200" cy="125" r="4" fill="#E6B8FF" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="600" cy="125" r="4" fill="#B8D4FF" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite" begin="2s"/>
  </circle>
</svg>
